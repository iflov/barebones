name: barebones-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - '${DB_TEST_HOST_PORT:-15432}:5432'
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}
      interval: 10s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
