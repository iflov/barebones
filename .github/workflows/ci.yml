name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: app
          POSTGRES_USER: app
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm config set store-dir ~/.pnpm-store
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:scaffold
      - run: pnpm check:observability
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: DB_HOST=127.0.0.1 DB_PORT=15432 pnpm test:e2e
      - run: pnpm build
      - name: Validate Docker Compose without warnings
        run: |
          errors=$(docker compose config --quiet 2>&1 >/dev/null)
          if [ -n "$errors" ]; then
            echo "$errors" >&2
            exit 1
          fi
