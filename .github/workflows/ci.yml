name: CI

# terraform-only 변경은 이 파이프라인을 태우지 않는다 — `terraform.yml`이 대신 돈다.
# `pull_request`와 `push`는 별개 이벤트라 양쪽에 모두 필요하다.
#
# ⚠ main에 branch protection이나 ruleset을 걸 때 이 job을 required check로
# 지정하면, skip된 실행이 Pending으로 남아 terraform-only PR이 영구히 막힌다.
# 그때는 required check를 두지 말고 별도 gate job을 쓴다.
on:
  pull_request:
    paths-ignore:
      - 'infra/terraform/**'
  push:
    branches: [main]
    paths-ignore:
      - 'infra/terraform/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_PASSWORD: app
          POSTGRES_USER: app
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
          pnpm config set store-dir ~/.pnpm-store
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:scaffold
      - run: pnpm check:observability
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: DB_HOST=127.0.0.1 DB_PORT=15432 pnpm test:e2e
      - run: pnpm build
      - name: Validate Docker Compose without warnings
        run: |
          errors=$(docker compose config --quiet 2>&1 >/dev/null)
          if [ -n "$errors" ]; then
            echo "$errors" >&2
            exit 1
          fi
