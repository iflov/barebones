# terraform 전용 검사. `ci.yml`에 job으로 얹지 않고 파일을 분리한 이유는
# 이 구성이 결국 자기 저장소로 나가기 때문이다 — 그때 이 파일이 함께 이동한다.
#
# 자격증명이 필요 없는 검사만 여기서 돈다. backend 블록이 생긴 뒤로
# `plan`은 backend 초기화를 요구하므로 `-backend=false`로 끊는다.
# plan/apply는 OIDC role이 붙은 별도 워크플로의 몫이며 아직 없다.
name: Terraform

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      # provider 스키마만 받고 backend는 건드리지 않는다.
      # `.terraform.lock.hcl`이 커밋돼 있으므로 provider 버전이 고정된다.
      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate
