image: node:24.18.1

definitions:
  caches:
    pnpm: .pnpm-store
  services:
    postgres:
      image: postgres:17-alpine
      variables:
        POSTGRES_DB: app
        POSTGRES_PASSWORD: app
        POSTGRES_USER: app

pipelines:
  default:
    - step:
        name: Validate
        caches:
          - pnpm
        services:
          - postgres
        script:
          - corepack enable
          - corepack prepare pnpm@11.22.0 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm check:scaffold
          - pnpm check:observability
          - pnpm lint
          - pnpm typecheck
          - pnpm test
          - DB_PORT=5432 pnpm test:e2e
          - pnpm build
