packages:
  - .

allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  # tsx executes TypeScript scripts through esbuild; keep its install script explicitly scoped.
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true

# `@nestjs/throttler` 6.7.0 is the selected latest release but is still inside
# pnpm's active minimum-release-age window. Remove this one-entry exception once
# the window expires; all Nest 12 launch-era exceptions have expired.
minimumReleaseAgeExclude:
  - '@nestjs/throttler@6.7.0'
